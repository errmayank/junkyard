name: "Release"

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  release:
    name: "Release"
    if: github.repository == 'errmayank/junkyard'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - id: version
        name: "Verify release tag"
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "junkyard") | .version')"

          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$GITHUB_REF_NAME'"
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match Cargo.toml version '$version'"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: auth
        name: "Authenticate with crates.io"
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: "Release crate"
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: "Create GitHub release"
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Junkyard $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
