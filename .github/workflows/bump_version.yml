name: "Bump Version"

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump for Junkyard"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  bump_version:
    name: "Bump Version"
    if: github.repository == 'errmayank/junkyard'
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: "Install cargo-edit"
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-edit

      - name: "Bump version"
        run: cargo set-version --bump "${{ inputs.level }}"

      - id: version
        name: "Read version"
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "junkyard") | .version')"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable semantic version, got '$version'"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "::error::Tag '$version' already exists"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: "Validate release package"
        run: cargo publish --dry-run --allow-dirty

      - name: "Commit and tag"
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"

          git add Cargo.toml

          if git diff --cached --quiet -- Cargo.toml; then
            echo "::error::Cargo.toml was not changed"
            exit 1
          fi

          git commit -m "Junkyard $VERSION"
          git tag -a "$VERSION" -m "Junkyard $VERSION"
          git push origin HEAD:main "refs/tags/$VERSION"
